<title>무연시 이례 조사 기록</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@700;800&family=Song+Myung&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 관리국 현장 단말기. 왼쪽은 1비트 탐색 화면과 기록 로그, 오른쪽은 종이 사건 파일이 꽂힌 서류함 탭 */
:root{
  --ink:#0b0b0c;
  --paper:#eeece4;
  --dim:#b8b6ad;
  --faint:#3a3a3d;
  --file:#e6e1d2;
  --file-ink:#1c1a16;
  --file-dim:#55524a;
  --stamp:#b3291f;
  --f-display:'Song Myung','Nanum Myeongjo','Batang',serif;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'Nanum Gothic Coding','D2Coding',ui-monospace,monospace;
  --f-file:'Nanum Myeongjo','Batang',serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.7;word-break:keep-all;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
button{font:inherit}
.app{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;border-bottom:2px solid var(--paper);padding-bottom:8px}
.brand{font-family:var(--f-display);font-size:28px;letter-spacing:.03em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.meta b{color:var(--paper);font-weight:700}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.main{display:flex;flex-direction:column;gap:10px;min-width:0}
.scene-wrap{position:relative;border:2px solid var(--paper);background:var(--ink)}
#scene{display:block;width:100%;max-width:100%;aspect-ratio:192/108;image-rendering:pixelated;image-rendering:crisp-edges}
.scene-tag{position:absolute;left:8px;top:8px;background:var(--ink);border:2px solid var(--paper);padding:2px 10px;font-size:14px;font-weight:500}
.scene-alert{position:absolute;right:8px;top:8px;background:var(--paper);color:var(--ink);padding:2px 10px;font-size:14px;font-weight:600}
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gauge{border:2px solid var(--paper);padding:5px 8px 7px}
.gauge .lab{display:flex;justify-content:space-between;gap:6px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:10px;border:1px solid var(--paper);margin-top:4px}
.bar i{display:block;height:100%;background:var(--paper)}
.bar.cont i{background:repeating-linear-gradient(90deg,var(--paper) 0 2px,var(--ink) 2px 4px)}
.stats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 18px;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.stats b{color:var(--paper);font-weight:700;font-family:var(--f-mono)}
.log{border:2px solid var(--paper);height:360px;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.log p{margin:0;max-width:62ch}
.log .ev{font-family:var(--f-file);font-weight:700;font-size:17px;line-height:1.8;color:var(--paper)}
.log .dim{font-size:15px;color:var(--dim)}
.log .act{font-size:15px;font-weight:600;color:var(--paper);margin-top:4px}
.log .act::before{content:"▸ ";color:var(--dim)}
.log .loc{align-self:flex-start;background:var(--paper);color:var(--ink);font-weight:600;font-size:15px;padding:3px 12px;margin-top:10px}
.log .head{align-self:flex-start;font-size:15px;font-weight:600;letter-spacing:.03em;border:2px solid var(--paper);padding:2px 10px;margin-top:8px}
.log .day{display:flex;align-items:center;gap:12px;max-width:none;margin:14px 0 4px;color:var(--dim);font-size:13px;font-weight:600;letter-spacing:.12em}
.log .day::before,.log .day::after{content:"";flex:1;height:0;border-top:1px dashed var(--dim)}
.log .roll{align-self:flex-start;font-family:var(--f-mono);font-size:14px;color:var(--dim);background:var(--faint);padding:3px 10px}
.log .roll b{color:var(--paper);font-weight:700}
.log .clue{border-left:3px solid var(--paper);padding:2px 0 2px 12px;font-size:15px;font-weight:500}
.log .clue::before{content:"단서 ";font-weight:700;color:var(--dim)}
.log .warn{font-size:15px;font-weight:600}
.log .warn::before{content:"! ";color:var(--dim)}
.log .good{font-size:15px;font-weight:600}
.log .good::before{content:"+ ";color:var(--dim)}
.log .chips{display:flex;flex-wrap:wrap;gap:6px;max-width:none}
.chip{font-family:var(--f-mono);font-size:13px;font-weight:700;padding:1px 8px;border:1px solid var(--dim);color:var(--paper)}
.chip.down{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.prompt{font-size:15px;color:var(--dim);font-weight:500}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{appearance:none;border:2px solid var(--paper);background:var(--ink);color:var(--paper);text-align:left;padding:11px 14px;font-size:16px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.choice{box-shadow:4px 4px 0 var(--faint);transition:transform .07s,box-shadow .07s,background .1s}
.choice:hover,.choice:focus-visible{background:var(--paper);color:var(--ink);outline:none;box-shadow:4px 4px 0 var(--dim)}
.choice:active:not([disabled]),.choice.pressed{transform:translate(4px,4px);box-shadow:0 0 0 var(--dim);background:var(--paper);color:var(--ink)}
.choice.pressed span::after{content:" …";animation:blink .5s steps(2) infinite}
.choices.busy .choice:not(.pressed){opacity:.4;pointer-events:none}
@keyframes blink{50%{opacity:0}}
.log .fresh{animation:freshIn .32s ease-out both}
@keyframes freshIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scene-wrap.scan{outline:2px dashed var(--paper);outline-offset:3px}
.dice[hidden]{display:none}
.dice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);border:3px solid var(--paper);padding:10px 22px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:200px;box-shadow:6px 6px 0 var(--paper)}
.dice .dl{font-size:14px;font-weight:600;color:var(--dim)}
.dice .dn{font-family:var(--f-mono);font-size:46px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.dice .dr{font-size:16px;font-weight:700;letter-spacing:.1em}
.dice.ok{background:var(--paper);color:var(--ink)}
.dice.ok .dl{color:var(--file-dim)}
.dice.ng .dn{text-decoration:line-through;text-decoration-thickness:3px}
@media (prefers-reduced-motion:reduce){.log .fresh{animation:none}.choice.pressed span::after{animation:none}}
.choice small{font-size:14px;font-weight:400;color:inherit;flex:none;opacity:.85}
.choice[disabled]{cursor:not-allowed;border-style:dashed;color:var(--dim)}
.choice[disabled]:hover{background:var(--ink);color:var(--dim)}
.choice.alt{border-color:var(--dim)}
.side{border:2px solid var(--paper);min-width:0}
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--paper)}
.tab{appearance:none;border:0;border-right:2px solid var(--paper);background:var(--ink);color:var(--paper);padding:9px 13px;font-size:15px;font-weight:500;cursor:pointer;position:relative}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab:focus-visible{outline:2px dashed var(--paper);outline-offset:-5px}
.tab .dot{position:absolute;top:4px;right:3px;width:5px;height:5px;background:currentColor}
.tabbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.tabbody>*,.main>*,.actpanel>*{flex-shrink:0}
.choices{flex-shrink:1}
.h{font-family:var(--f-display);font-size:22px;margin:0}
.sub{font-size:14px;color:var(--dim);margin:0}
.sbtn{appearance:none;border:2px solid var(--paper);background:var(--ink);color:var(--paper);padding:4px 12px;font-size:14px;font-weight:500;cursor:pointer}
.sbtn:hover,.sbtn:focus-visible{background:var(--paper);color:var(--ink);outline:none}
.sbtn[disabled]{border-style:dashed;color:var(--dim);cursor:not-allowed}
.sbtn[disabled]:hover{background:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--faint)}
.row:last-child{border-bottom:0}
.row .nm{min-width:0}
.row .ds{display:block;font-size:14px;color:var(--dim);line-height:1.6}
.row .act{display:flex;gap:6px;flex:none}
.sec{display:flex;flex-direction:column}
.sec>.lbl{font-size:14px;font-weight:600;color:var(--dim);letter-spacing:.04em;border-bottom:1px solid var(--paper);padding-bottom:3px;margin-bottom:2px}
.file{background:var(--file);color:var(--file-ink);font-family:var(--f-file);font-weight:700;padding:16px;display:flex;flex-direction:column;gap:12px}
.file-top{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--file-ink);padding-bottom:6px;font-size:13px;font-weight:500;font-family:var(--f-ui)}
.file h3{font-family:var(--f-display);font-size:23px;margin:0;font-weight:400;text-wrap:balance}
.file p{margin:0;font-size:16px;line-height:1.75}
.file .muted{color:var(--file-dim);font-size:14px;font-weight:500;font-family:var(--f-ui)}
.file-body{display:grid;grid-template-columns:128px minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:420px){.file-body{grid-template-columns:minmax(0,1fr)}}
.thumb{width:128px;max-width:100%;aspect-ratio:192/108;image-rendering:pixelated;background:var(--file-ink);display:block}
.stamp{border:2px solid var(--stamp);color:var(--stamp);padding:0 8px;transform:rotate(-3deg);font-weight:700;white-space:nowrap}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.clues li{font-size:15px;line-height:1.7;padding-left:20px;position:relative}
.clues li::before{content:"□";position:absolute;left:0;font-family:var(--f-ui)}
.clues li.got::before{content:"■"}
.clues li.miss{color:var(--file-dim)}
.mini{display:flex;flex-direction:column;gap:8px}
.mini .file{padding:10px 12px;gap:4px}
.mini .file h3{font-size:19px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:15px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.statrow{display:grid;grid-template-columns:3.5em 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums;font-size:15px;padding:3px 0}
.statrow .bar{margin:0;height:8px}
.note{font-size:14px;color:var(--dim);margin:0;line-height:1.65}
textarea,input[type=text]{width:100%;box-sizing:border-box;background:var(--ink);color:var(--paper);border:2px solid var(--paper);font-family:var(--f-mono);font-size:13px;padding:10px}
input[type=text]{font-family:var(--f-ui);font-size:17px}
textarea{min-height:80px;resize:vertical}
textarea:focus,input:focus{outline:2px dashed var(--paper);outline-offset:2px}
.overlay{position:fixed;inset:0;background:var(--ink);overflow-y:auto;z-index:20;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dialog{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.dialog .title{font-family:var(--f-display);font-size:40px;line-height:1.2;margin:0;text-wrap:balance}
.dialog .lead{color:var(--dim);margin:0;max-width:60ch;font-size:17px}
.origins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:720px){.origins{grid-template-columns:minmax(0,1fr)}}
.origin{appearance:none;text-align:left;border:2px solid var(--paper);background:var(--ink);color:var(--paper);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.origin[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.origin:focus-visible{outline:2px dashed var(--paper);outline-offset:3px}
.origin .on{font-family:var(--f-display);font-size:24px}
.origin .od{font-size:15px;line-height:1.65}
.origin .os{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;border-top:1px solid currentColor;padding-top:10px;font-variant-numeric:tabular-nums}
.origin .os3{grid-template-columns:repeat(3,minmax(0,1fr));border-top:0;padding-top:0}
.origin .os>span{display:flex;flex-direction:column;gap:0}
.origin .os i{font-style:normal;font-size:13px;font-weight:500;color:var(--dim)}
.origin .os b{font-family:var(--f-mono);font-size:21px;font-weight:700;line-height:1.3}
.origin[aria-pressed="true"] .os i{color:var(--file-dim)}
.diff{font-size:13px;font-weight:600;border:2px solid currentColor;padding:0 8px;align-self:flex-start}
.ending .title{font-size:46px}
.ending p{font-family:var(--f-file);font-weight:700;font-size:18px;line-height:1.8;max-width:60ch;margin:0}
details summary{cursor:pointer;color:var(--dim);font-size:15px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.tab-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dossier{background:var(--file);color:var(--file-ink);font-family:var(--f-file);font-weight:700;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 var(--faint);position:relative}
.dossier::before{content:"";position:absolute;top:-8px;left:18px;width:84px;height:10px;background:var(--file);border-radius:3px 3px 0 0}
.dos-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-ui);font-size:13px;font-weight:500;border-bottom:2px solid var(--file-ink);padding-bottom:6px}
.dos-head{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:440px){.dos-head{grid-template-columns:minmax(0,1fr)}}
.dthumb{width:100%;max-width:100%;aspect-ratio:192/108;image-rendering:pixelated;display:block;border:2px solid var(--file-ink)}
.dos-id{display:flex;flex-direction:column;gap:6px;min-width:0}
.dos-no{font-family:var(--f-mono);font-size:22px;font-weight:700;letter-spacing:.04em;line-height:1}
.dossier h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.25;text-wrap:balance}
.dossier .muted{font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--file-dim)}
.dossier section{display:flex;flex-direction:column;gap:4px}
.dossier h4{margin:0;font-family:var(--f-ui);font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--file-dim)}
.dossier p{margin:0;font-size:15px;line-height:1.75}
.dos-foot{font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--file-dim);border-top:1px dashed var(--file-dim);padding-top:8px}
.redacts{display:flex;flex-direction:column;gap:7px;padding:4px 0}
.redact{display:block;height:14px;background:var(--file-ink)}
.redact.inl{display:inline-block;width:8em;height:.8em;vertical-align:middle}
.depth{display:flex;gap:3px;font-family:var(--f-ui)}
.depth .dp{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;max-width:52px}
.depth .dp i{display:block;width:100%;height:9px;border:2px solid var(--file-ink)}
.depth .dp.on i{background:var(--file-ink)}
.depth .dp em{font-style:normal;font-size:11px;font-weight:600;color:var(--file-dim)}
.depth .dp.on em{color:var(--file-ink)}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:6px}
.ctile{appearance:none;background:var(--ink);color:var(--paper);border:2px solid var(--paper);padding:0 0 6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;font-family:var(--f-ui)}
.ctile canvas{width:100%;aspect-ratio:192/108;image-rendering:pixelated;display:block;border-bottom:2px solid var(--paper);margin-bottom:4px}
.ctile .ct-no{font-family:var(--f-mono);font-size:13px;font-weight:700;padding:0 8px}
.ctile .ct-n{font-size:13px;font-weight:500;padding:0 8px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctile .pips{display:flex;gap:3px;padding:2px 8px 0}
.ctile .pips i{width:10px;height:5px;border:1px solid currentColor}
.ctile .pips i.on{background:currentColor}
.ctile:hover:not([disabled]),.ctile:focus-visible{outline:none;box-shadow:4px 4px 0 var(--dim)}
.ctile.sel{background:var(--paper);color:var(--ink)}
.ctile.sel canvas{border-bottom-color:var(--ink)}
.ctile[disabled]{cursor:default;border-style:dashed;color:var(--dim)}
.gloss{border-top:2px solid var(--paper);padding-top:10px}
.gloss summary{font-size:15px;font-weight:600;color:var(--paper)}
.gloss dl{margin:10px 0 0;display:flex;flex-direction:column}
.gloss .gl{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--faint)}
.gloss dt{font-family:var(--f-display);font-size:17px}
.gloss dd{margin:0;font-size:14px;color:var(--dim);line-height:1.6}
@media (max-width:440px){.gloss .gl{grid-template-columns:minmax(0,1fr);gap:2px}}
.counter{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ticket{position:relative;display:flex;align-items:baseline;gap:8px;background:var(--paper);color:var(--ink);padding:10px 22px 10px 18px;border-right:3px dashed var(--ink);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--ink)}
.ticket::before,.ticket::after{content:"";position:absolute;right:-9px;width:14px;height:14px;border-radius:50%;background:var(--ink)}
.ticket::before{top:-7px}.ticket::after{bottom:-7px}
.tk-l{font-size:13px;font-weight:600;letter-spacing:.06em}
.tk-n{font-family:var(--f-mono);font-size:38px;font-weight:700;line-height:1}
.tk-s{font-size:14px;font-weight:600}
.counter .note{flex:1;min-width:12em}
.pulls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pull{appearance:none;cursor:pointer;background:var(--ink);color:var(--paper);border:2px solid var(--paper);padding:14px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;box-shadow:5px 5px 0 var(--dim);transition:transform .07s,box-shadow .07s;font-family:var(--f-ui)}
.pull .pt{font-family:var(--f-display);font-size:20px;line-height:1.2}
.pull .pc{font-size:13px;font-weight:500;color:var(--dim)}
.pull:hover:not([disabled]),.pull:focus-visible{background:var(--paper);color:var(--ink);outline:none}
.pull:hover:not([disabled]) .pc,.pull:focus-visible .pc{color:var(--file-dim)}
.pull:active:not([disabled]){transform:translate(5px,5px);box-shadow:0 0 0 var(--dim)}
.pull[disabled]{cursor:not-allowed;border-style:dashed;box-shadow:none;color:var(--dim)}
.haul{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;margin-top:6px}
.loot{display:flex;flex-direction:column;gap:4px;padding:10px;border:2px solid var(--paper);min-width:0;position:relative}
.loot .rr{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--dim)}
.loot b{font-size:15px;font-weight:600}
.loot .ld{font-size:13px;color:var(--dim);line-height:1.5}
.loot .dup{font-size:12px;font-weight:600;border-top:1px dashed var(--dim);padding-top:4px;margin-top:2px}
.loot.r1{border-style:double;border-width:5px;padding:7px}
.loot.r1 .rr{color:var(--paper)}
.loot.r2{background:var(--paper);color:var(--ink);box-shadow:5px 5px 0 var(--dim)}
.loot.r2 .rr,.loot.r2 .ld{color:var(--file-dim)}
.loot.r2::after{content:"특수";position:absolute;top:8px;right:8px;border:2px solid var(--stamp);color:var(--stamp);font-size:11px;font-weight:700;padding:0 5px;transform:rotate(6deg)}
.ico{width:36px;height:36px;image-rendering:pixelated;color:var(--paper);display:block}
.loot.r2 .ico{color:var(--ink)}

.fin-title{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.2;margin:0;text-wrap:balance}
.fin-lead{margin:0;font-family:var(--f-file);font-weight:700;font-size:18px;line-height:1.8;max-width:60ch}
.fin-note{margin:0;color:var(--dim);font-size:15px;max-width:60ch}
.fin-btns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.fin-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fin-card{appearance:none;cursor:pointer;text-align:left;background:var(--file);color:var(--file-ink);border:0;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:6px 6px 0 var(--faint);font-family:var(--f-ui);transition:transform .08s,box-shadow .08s}
.fin-card b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.25}
.fin-card span:last-child{font-size:14px;line-height:1.6;color:var(--file-dim)}
.fin-card .rp-stamp{align-self:flex-start;font-size:14px;padding:1px 8px;transform:rotate(-4deg)}
.fin-card:hover:not([disabled]),.fin-card:focus-visible{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--dim);outline:none}
.fin-card.off{opacity:.45;cursor:not-allowed;box-shadow:none}
.fin-epi{display:flex;flex-direction:column;gap:16px;min-height:30vh}
.fin-epi p{margin:0;font-family:var(--f-file);font-weight:700;font-size:19px;line-height:1.85;color:var(--dim)}
.fin-epi p:last-child{color:var(--paper)}
.fin-epi p.fresh{animation:freshIn .5s ease-out both}
.gate{position:fixed;inset:0;z-index:60;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto}
.gate-box{width:min(460px,100%);background:var(--file);color:var(--file-ink);padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:8px 8px 0 var(--faint);font-family:var(--f-file);font-weight:700}
.gate-top{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-ui);font-size:13px;font-weight:600;border-bottom:3px double var(--file-ink);padding-bottom:8px}
.gate-box h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,7vw,34px);line-height:1.2}
.gate-box p{margin:0;font-size:16px;line-height:1.7}
.gate-box input{background:var(--ink);color:var(--paper);border:2px solid var(--file-ink);font-family:var(--f-mono);font-size:18px;padding:10px 12px;letter-spacing:.15em}
.gate-box .choice{justify-content:center}
.gate-msg{min-height:1.7em;color:var(--stamp);font-family:var(--f-ui);font-size:14px!important}
.gate-box.shake{animation:gshake .3s}
@keyframes gshake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.gate-box.shake{animation:none}}
.cropper{position:fixed;inset:0;z-index:40;background:rgba(11,11,12,.94);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.crop-dlg{background:var(--ink);border:2px solid var(--paper);box-shadow:8px 8px 0 var(--faint);padding:24px;display:flex;flex-direction:column;gap:20px;width:min(980px,100%)}
.crop-head{display:flex;flex-direction:column;gap:2px}
.crop-head b{font-family:var(--f-display);font-size:30px;font-weight:400}
.crop-head .note{font-size:16px}
.crop-body{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.crop-body{grid-template-columns:minmax(0,1fr)}}
.crop-stage canvas{display:block;width:100%;max-width:480px;aspect-ratio:1;border:2px solid var(--paper);cursor:grab;touch-action:none;background:#111}
.crop-stage canvas:active{cursor:grabbing}
.crop-stage canvas:focus-visible{outline:2px dashed var(--paper);outline-offset:3px}
.crop-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.crop-side .sbtn,.crop-foot .sbtn{font-size:16px;padding:7px 16px}
.crop-prev{display:flex;flex-direction:column;gap:6px}
.crop-prev img{width:192px;height:192px;image-rendering:pixelated;border:2px solid var(--paper);background:var(--ink)}
.crop-row{display:grid;grid-template-columns:3em minmax(0,1fr);align-items:center;gap:10px;font-size:16px;font-weight:600}
.crop-row input{width:100%;accent-color:var(--paper)}
.crop-foot{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.crop-ok{padding:10px 18px}
.crop-dot{display:flex;flex-direction:column;gap:8px}
.crop-hint{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);padding-left:calc(3em + 8px);margin-top:-6px}
.crop-ok .pt{font-size:22px}
.seg .sbtn[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--faint);padding:8px;min-width:0}
.slot.on{border:2px solid var(--paper)}
.slot b{font-size:14px}
.slot .ds{font-size:12px;color:var(--dim)}
.slot-btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.slot-btns .sbtn{font-size:12px;padding:2px 8px}
.seal.md{width:56px;height:56px}
.seal.empty{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim);border-style:dashed}
.rename{display:flex;flex-direction:column;gap:4px}
.rn-row{display:flex;gap:6px}
.rn-row input{flex:1;min-width:0;font-family:var(--f-display);font-size:20px;padding:4px 8px}
.sceneseal{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:none}
.sceneseal .seal{width:clamp(44px,14%,72px);height:auto;aspect-ratio:1;border:2px solid var(--paper);box-shadow:3px 3px 0 var(--ink)}
.sceneseal span{font-size:11px;font-weight:700;background:var(--paper);color:var(--ink);padding:0 5px}
.sceneseal span:empty{display:none}
.sceneseal.st-hurt .seal{border-style:dashed}
.sceneseal.st-panic .seal{animation:shiver .18s steps(2) infinite}
@keyframes shiver{0%{transform:translate(1px,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(0,-1px)}}
@media (prefers-reduced-motion:reduce){.sceneseal.st-panic .seal{animation:none}}
.fishbox{display:flex;flex-direction:column;gap:10px}
.fishbar{position:relative;height:34px;border:2px solid var(--paper);background:repeating-linear-gradient(90deg,var(--ink) 0 6px,var(--faint) 6px 7px)}
.fishbar .fz{position:absolute;top:0;bottom:0;background:var(--dim);opacity:.55}
.fishbar.bite .fz{background:var(--paper);opacity:.85}
.fishbar.idle{opacity:.5}
.fishbar .fm{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--paper);box-shadow:0 0 0 2px var(--ink)}
.fdex{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:6px}
.fx{border:1px dashed var(--faint);padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.fx b{font-size:13px;color:var(--dim)}
.fx span{font-size:11px;color:var(--dim)}
.fx.got{border:2px solid var(--paper)}
.fx.got b{color:var(--paper)}
.fx.got.r1{border-style:double;border-width:4px}
.fx.got.r2{background:var(--paper)}
.fx.got.r2 b,.fx.got.r2 span{color:var(--ink)}
.evid.key{background:var(--paper)}
.aff{flex:none;width:70px;height:7px;border:1px solid var(--paper);align-self:center}
.aff i{display:block;height:100%;background:var(--paper)}
.npcstory summary{font-size:13px;color:var(--dim);cursor:pointer;margin-top:4px}
.npcstory p{margin:6px 0 0;font-family:var(--f-file);font-weight:700;font-size:14px;line-height:1.65;color:var(--paper)}
.dossier.lore p{position:relative;padding-left:30px}
.lnum{position:absolute;left:0;font-family:var(--f-mono);font-size:12px;color:var(--file-dim)}
.lred{position:relative;padding-left:30px}
.endgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.endcell{border:1px dashed var(--faint);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.endcell .rp-stamp{font-size:15px;padding:2px 10px;border-color:var(--faint);color:var(--dim)}
.endcell.got{border:2px solid var(--paper);background:var(--file)}
.endcell.got .rp-stamp{border-color:var(--stamp);color:var(--stamp);transform:rotate(-6deg)}
.endcell small{font-size:12px;color:var(--dim)}
.endcell.got small{color:var(--file-dim)}
.report.k-final{background:repeating-linear-gradient(0deg,var(--file) 0 5px,#d9dccf 5px 6px)}
.actpanel{display:flex;flex-direction:column;gap:8px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .sbtn[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
@media (min-width:700px){
  html:has(body.fit),body.fit{height:100%}
  body.fit{box-sizing:border-box;padding-block:12px;overflow:hidden}
  body.fit .app{height:100%;max-width:1440px}
  body.fit .grid{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch}
  body.fit .main{min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:12px}
  body.fit .scene-wrap{grid-column:1;grid-row:1;align-self:start}
  body.fit .gauges{grid-column:2;grid-row:1;grid-template-columns:minmax(0,1fr);align-content:start;gap:8px}
  body.fit .log{grid-column:1;grid-row:2;height:auto;min-height:0}
  body.fit .actpanel{grid-column:2;grid-row:2;min-height:0}
  body.fit .choices{overflow-y:auto;min-height:0;padding:0 8px 8px 0}
  body.fit .side{min-height:0;display:flex;flex-direction:column}
  body.fit .tabbody{overflow-y:auto;flex:1;min-height:0}
}
@media (min-width:700px) and (max-width:1099px){
  body.fit .grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  body.fit .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
  body.fit .scene-wrap{grid-column:1;grid-row:1;max-height:30vh;overflow:hidden}
  body.fit #scene{max-height:30vh;object-fit:contain;margin:0 auto;width:auto;max-width:100%}
  body.fit .gauges{grid-column:1;grid-row:2;grid-template-columns:repeat(3,minmax(0,1fr))}
  body.fit .log{grid-column:1;grid-row:3}
  body.fit .actpanel{grid-column:1;grid-row:4;max-height:38vh}
}
@media (min-width:1100px) and (max-height:760px){
  body.fit .main{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
}

const GK='muyeon-gate-v2',LK='muyeon-gate-lock';
const CHO='r R s e E f a q Q t T d w W c z x v g'.split(' ');
const JUNG='k o i O j p u P h hk ho hl y n nj np nl b m ml l'.split(' ');
const JONG=' r R rt s sw sg e f fr fa fq ft fx fv fg a q qt t T d w c z x v g'.split(' ');
const COMPAT='r R rt s sw sg e E f fr fa fq ft fx fv fg a q Q qt t T d w W c z x v g k o i O j p u P h hk ho hl y n nj np nl b m ml l'.split(' ');
function qwerty(w){let o='';for(const ch of w){const c=ch.codePointAt(0);
  if(c>=0xAC00&&c<=0xD7A3){const i=c-0xAC00;o+=CHO[(i/588)|0]+JUNG[((i%588)/28)|0]+JONG[i%28]}
  else if(c>=0x3131&&c<=0x3163)o+=COMPAT[c-0x3131];else o+=ch}
  return o.toLowerCase()}
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(ENC.s),iterations:ENC.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open_(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ENC.i)},key,b64d(ENC.c));return new TextDecoder().decode(pt)}
function run(code){const sc=document.createElement('script');sc.textContent=code;document.body.appendChild(sc)}
const st=()=>{try{return JSON.parse(localStorage.getItem(LK)||'{}')||{}}catch(e){return {}}};
const setSt=o=>{try{localStorage.setItem(LK,JSON.stringify(o))}catch(e){}};
async function tryStored(){try{const r=localStorage.getItem(GK);if(!r)return false;const k=await crypto.subtle.importKey('raw',b64d(r),'AES-GCM',false,['decrypt']);run(await open_(k));return true}catch(e){try{localStorage.removeItem(GK)}catch(e2){}return false}}
function form(){
  const g=document.createElement('div');g.className='gate';g.setAttribute('role','dialog');g.setAttribute('aria-label','출입 암호');
  g.innerHTML=`<form class="gate-box" autocomplete="off"><div class="gate-top"><span>이상현상관리국 무연지부</span><span>베타 열람 · v58</span></div>
    <h1>무연시 이례 조사 기록</h1><p>이 기록은 허가된 조사자만 열람할 수 있다.<br>관리국 출입 암호를 입력하시오.</p>
    <input type="password" id="gatePw" aria-label="출입 암호" autocomplete="current-password" spellcheck="false">
    <button type="submit" class="choice" id="gateGo"><span>▸ 출입</span></button><p class="gate-msg" id="gateMsg" aria-live="polite"></p></form>`;
  document.body.appendChild(g);
  const pw=g.querySelector('#gatePw'),msg=g.querySelector('#gateMsg'),go=g.querySelector('#gateGo'),box=g.querySelector('.gate-box');
  let timer=null,busy=false;
  const lockLeft=()=>Math.max(0,Math.ceil(((st().u||0)-Date.now())/1000));
  function tick(){const l=lockLeft();pw.disabled=go.disabled=l>0||busy;if(l>0){msg.textContent=`암호를 너무 많이 틀렸다. ${l}초 뒤에 다시 시도할 수 있다.`;if(!timer)timer=setInterval(tick,1000)}else if(timer){clearInterval(timer);timer=null;msg.textContent='';pw.focus()}}
  tick();if(!lockLeft())pw.focus();
  if(!window.crypto||!crypto.subtle){msg.textContent='이 브라우저에서는 기록을 열 수 없다. 최신 브라우저로 열어 주시오.';pw.disabled=go.disabled=true;return}
  g.querySelector('form').onsubmit=async e=>{
    e.preventDefault();if(busy||lockLeft())return;const v=qwerty(pw.value.trim().normalize('NFC'));if(!v)return;
    busy=true;tick();msg.textContent='확인 중…';
    let code=null,key=null;try{key=await derive(v);code=await open_(key)}catch(err){}
    busy=false;
    if(code!==null){setSt({});try{localStorage.setItem(GK,b64e(await crypto.subtle.exportKey('raw',key)))}catch(err){}g.remove();run(code);return}
    const s=st();s.f=(s.f||0)+1;if(s.f>=5)s.u=Date.now()+Math.min(600,30*2**(s.f-5))*1000;setSt(s);
    pw.value='';box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
    msg.textContent=s.f>=5?'':`암호가 맞지 않는다. (${s.f}/5)`;tick();
  };
}
tryStored().then(ok=>{if(!ok)form()});
})();
